openapi: 3.1.0
info:
  title: Archeology
  version: 1.0.0
  description: |
    REST web service exposing data about archeological sites of the Ancient
    Mediterranean. This document covers the **/sites** resource (collection,
    singleton and related sub-collections).
servers:
  - url: http://localhost/archeology
    description: Localhost server for the archeology web service
paths:
  /sites:
    get:
      summary: Get the list of famous archeological sites
      operationId: getSites
      description: Returns a paginated, filterable and sortable collection of
        archeological sites. Default sort is ascending by `site_id`.
        String filters are case-insensitive and use "contains" matching.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SiteNameParam"
        - $ref: "#/components/parameters/SiteTypeParam"
        - $ref: "#/components/parameters/DiscoveryDateParam"
        - $ref: "#/components/parameters/MinAgeParam"
        - $ref: "#/components/parameters/MaxAgeParam"
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/RegionParam"
        - $ref: "#/components/parameters/ProtectedParam"
        - $ref: "#/components/parameters/CultureIdParam"
        - $ref: "#/components/parameters/PeriodIdParam"
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "404":
          description: Not Found
        "422":
          description: Unprocessable Content

components:
  parameters:
    PageParam:
      name: current_page
      in: query
      description: Page number for pagination (starts from 1)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    PageSizeParam:
      name: page_size
      in: query
      description: The number of items generated for each page
      required: false
      schema:
        minimum: 1
        maximum: 200
        default: 10
      example: 1

    SiteNameParam:
      name: site_name
      in: query
      description: Case-insensitive "contains" match on the site name.
      required: false
      schema:
        type: string
      example: pompeii

    SiteTypeParam:
      name: site_type
      in: query
      description: Case-insensitive "contains" match on the site type.
      required: false
      schema:
        type: string
      example: basilica

    DiscoveryDateParam:
      name: discovery_date
      in: query
      required: false
      description: |
        Two comma-separated dates (start,end). Each date is `YYYY-MM-DD` or
        `YYYY-MM`. Dates cannot be in the future and start must not be after end.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}(-\d{2})?,\d{4}-\d{2}(-\d{2})?$'
      example: 2006-01-22,2026-09-13

    MinAgeParam:
      name: age_min
      in: query
      description: Minimum estimated age in years. Cannot be negative.
      required: false
      schema:
        type: number
        minimum: 0
        maximum: 600000000
      example: 4000

    MaxAgeParam:
      name: age_max
      in: query
      description: Maximum estimated age in years. Cannot be negative.
      required: false
      schema:
        type: number
        minimum: 0
        maximum: 600000000
      example: 10000

    CountryParam:
      name: country
      in: query
      description: Case-insensitive "contains" match on the country.
      required: false
      schema:
        type: string
      example: italy

    RegionParam:
      name: region
      in: query
      description: Case-insensitive "contains" match on the region.
      required: false
      schema:
        type: string
      example: sicily

    ProtectedParam:
      name: is_protected
      in: query
      description: Filter on protected status. Accepts `true`, `false`, `1` or `0`.
      required: false
      schema:
        type: string
        enum: ["true", "false", "1", "0"]
      example: "true"

    CultureIdParam:
      name: culture_id
      in: query
      description: Only sites belonging to this culture. Must be a non-negative integer.
      required: false
      schema:
        type: integer
        minimum: 1
      example: 4

    PeriodIdParam:
      name: period_id
      in: query
      description: Only sites belonging to this historical period. Must be a non-negative integer.
      required: false
      schema:
        type: integer
        minimum: 1
      example: 8

    SiteSortParam:
      name: sort
      in: query
      required: false
      description: |
        Field to sort by. Ascending by default; prefix with `-` for descending
        (e.g. `-discovery_date`).
        Sortable fields: site_name, site_type, discovery_date, estimated_age,
        country, region, latitude, longitude, culture_id, period_id.
      schema:
        type: string
        pattern: "^-?(site_name|site_type|discovery_date|estimated_age|country|region|latitude|longitude|culture_id|period_id)$"
      example: -estimated_age
