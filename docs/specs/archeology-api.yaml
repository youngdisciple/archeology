openapi: 3.0.3
info:
  title: Archeology API
  version: 3.1.0
  description: |
    OpenAPI specification for the GET endpoints of Iteration 1.
servers:
  - url: http://localhost/archeology
    description: Local server
tags:
  - name: Museums
  - name: Artifacts
  - name: Scientists
  - name: Sites
paths:
  /museums:
    get:
      tags: [Museums]
      operationId: listMuseums
      summary: List museums
      description: Returns a filtered, sorted, paginated collection of museums.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageItems"
        - $ref: "#/components/parameters/MuseumSort"
        - $ref: "#/components/parameters/MuseumName"
        - $ref: "#/components/parameters/MuseumNameEquals"
        - $ref: "#/components/parameters/MuseumNameStartsWith"
        - $ref: "#/components/parameters/MuseumNameEndsWith"
        - $ref: "#/components/parameters/City"
        - $ref: "#/components/parameters/CityEquals"
        - $ref: "#/components/parameters/CityStartsWith"
        - $ref: "#/components/parameters/CityEndsWith"
        - $ref: "#/components/parameters/MuseumType"
        - $ref: "#/components/parameters/MuseumTypeEquals"
        - $ref: "#/components/parameters/MuseumTypeStartsWith"
        - $ref: "#/components/parameters/MuseumTypeEndsWith"
        - name: foundation_date_after
          in: query
          description: Founded on or after this date (inclusive).
          schema: { type: string, format: date }
        - name: foundation_date_before
          in: query
          description: Founded on or before this date (inclusive).
          schema: { type: string, format: date }
        - name: foundation_date_between
          in: query
          description: Comma-separated inclusive date range, YYYY-MM-DD,YYYY-MM-DD. Do not combine with after or before.
          schema:
            { type: string, pattern: '^\d{4}-\d{2}-\d{2},\d{4}-\d{2}-\d{2}$' }
        - name: has_website
          in: query
          description: Whether the museum has a nonempty website field. Accepts true, false, 1, or 0.
          schema: { type: string, enum: ["true", "false", "1", "0"] }
      responses:
        "200":
          description: Museum Collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MuseumCollection" }
              example:
                meta: { page: 1, page_size: 5, total_records: 1 }
                data:
                  - museum_id: 1
                    museum_name: Example Museum
                    city: Example City
                    museum_type: Example Type
                    foundation_date: "1880-01-01"
                    website: https://example.org
        "400": { $ref: "#/components/responses/BadRequest" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /museums/{museumId}:
    get:
      tags: [Museums]
      operationId: getMuseumById
      summary: Get a museum by ID
      parameters:
        - $ref: "#/components/parameters/MuseumId"
      responses:
        "200":
          description: Museum found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Museum" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /museums/{museumId}/scientists:
    get:
      tags: [Museums]
      operationId: listMuseumScientists
      summary: List scientists associated with a museum
      description: Name and specialization use exact-value matching
      parameters:
        - $ref: "#/components/parameters/MuseumId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageItems"
        - name: first_name
          in: query
          description: Exact scientist first name.
          schema: { type: string }
        - name: specialization
          in: query
          description: Exact specialization.
          schema: { type: string }
        - name: is_active
          in: query
          schema: { type: string, enum: ["true", "false", "1", "0"] }
        - name: min_experience
          in: query
          schema: { type: integer, minimum: 0, maximum: 69 }
        - name: max_experience
          in: query
          schema: { type: integer, minimum: 1, maximum: 70 }
        - name: has_degree
          in: query
          schema: { type: string, enum: [BA, BSc, MA, MSc, PhD] }
        - name: sort
          in: query
          description: Prefix an allowed column name with '-' for descending order.
          schema:
            type: string
            enum:
              [
                first_name,
                "-first_name",
                last_name,
                "-last_name",
                specialization,
                "-specialization",
                degree,
                "-degree",
                years_of_experience,
                "-years_of_experience",
              ]
      responses:
        "200":
          description: Scientists for the museum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScientistCollection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /museums/{museumId}/artifacts:
    get:
      tags: [Museums]
      operationId: listMuseumArtifacts
      summary: List artifacts belonging to a museum
      parameters:
        - $ref: "#/components/parameters/MuseumId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageItems"
        - name: artifact_name
          in: query
          description: Partial match on artifact name.
          schema: { type: string }
        - name: artifact_type
          in: query
          description: Exact database enum value.
          schema: { type: string }
        - name: condition
          in: query
          description: Exact database enum value
          schema: { type: string }
        - name: over_estimated_value
          in: query
          description: Lower estimated value bound
          schema: { type: number, format: float, minimum: 0 }
        - name: below_estimated_value
          in: query
          description: Upper estimated value bound
          schema: { type: number, format: float, minimum: 0 }
        - name: sort
          in: query
          description: Prefix an allowed field with '-' for descending order.
          schema:
            type: string
            enum:
              [
                artifact_name,
                "-artifact_name",
                estimated_value,
                "-estimated_value",
                condition,
                "-condition",
                material,
                weight_in_g,
                height_in_cm,
              ]
      responses:
        "200":
          description: Artifacts for the museum
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactCollection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /artifacts:
    get:
      tags: [Artifacts]
      operationId: listArtifacts
      summary: List artifacts
      description: Returns a filtered, sorted, paginated collection of artifacts. Note that all values are case-insensitive strings.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageItems"
        - name: artifact_name
          in: query
          description: Partial match on artifact name.
          schema: { type: string }
        - name: artifact_type
          in: query
          description: Exact database enum value.
          schema: { type: string }
        - name: condition
          in: query
          description: Exact database enum value.
          schema: { type: string }
        - name: museum_id
          in: query
          description: Only artifacts belonging to this museum.
          schema: { type: integer, minimum: 1 }
        - name: over_estimated_value
          in: query
          description: Lower estimated value bound
          schema: { type: number, format: float, minimum: 0 }
        - name: below_estimated_value
          in: query
          description: Upper estimated value bound
          schema: { type: number, format: float, minimum: 0 }
        - name: sort_by
          in: query
          description: The response is sorted by artifact_id if no `sort_by` parameter is provided.
          schema:
            type: string
            enum: [artifact_id, artifact_name, estimated_value, condition]
        - name: order
          in: query
          description: The response's order is by ascending if no `order` parameter is provided.
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Artifact Collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactCollection" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/ServerError" }
  /artifacts/{artifactId}:
    get:
      tags: [Artifacts]
      operationId: getArtifactById
      summary: Get an artifact by ID
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Artifact found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "500": { $ref: "#/components/responses/ServerError" }
  /sites:
    get:
      tags: [Sites]
      summary: Get the list of famous archeological sites
      operationId: getSites
      description: Returns a paginated, filterable and sortable collection of
        archeological sites. Default sort is ascending by `site_id`.
        String filters are case-insensitive and use "contains" matching.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SiteNameParam"
        - $ref: "#/components/parameters/SiteTypeParam"
        - $ref: "#/components/parameters/DiscoveryDateParam"
        - $ref: "#/components/parameters/MinAgeParam"
        - $ref: "#/components/parameters/MaxAgeParam"
        - $ref: "#/components/parameters/CountryParam"
        - $ref: "#/components/parameters/RegionParam"
        - $ref: "#/components/parameters/ProtectedParam"
        - $ref: "#/components/parameters/CultureIdParam"
        - $ref: "#/components/parameters/PeriodIdParam"
        - $ref: "#/components/parameters/SiteSortParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteCollection" }
              example:
                meta: { page: 1, page_size: 10, total_records: 12 }
                data:
                  - site_id: 5
                    site_name: Pompeii
                    site_type: city
                    discovery_date: "1748-03-30"
                    estimated_age: 2700
                    country: Italy
                    region: Campania
                    latitude: 40.7462
                    longitude: 14.4989
                    is_protected: true
                    culture_id: 4
                    period_id: 8
        "400": { $ref: "#/components/responses/BadRequest" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "500": { $ref: "#/components/responses/ServerError" }
  /sites/{siteId}:
    get:
      tags: [Sites]
      operationId: getSiteById
      summary: Get a site by ID
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: Site found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "500": { $ref: "#/components/responses/ServerError" }
components:
  parameters:
    MuseumId:
      name: museumId
      in: path
      required: true
      description: Positive integer museum identifier.
      schema: { type: integer, minimum: 1 }
      example: 1
    Page:
      name: page
      in: query
      description: 1-based page index
      schema: { type: integer, minimum: 1, maximum: 999, default: 1 }
    PageItems:
      name: pageItems
      in: query
      description: Items per page
      schema: { type: integer, minimum: 1, maximum: 999, default: 10 }
    MuseumSort:
      name: sort
      in: query
      description: Sort by field, ascending by default. Prefix with '-' for descending.
      schema:
        type: string
        enum:
          [
            museum_name,
            "-museum_name",
            city,
            "-city",
            museum_type,
            "-museum_type",
            foundation_date,
            "-foundation_date",
          ]
    MuseumName:
      name: museum_name
      in: query
      description: Museum name contains this text.
      schema: { type: string }
    MuseumNameEquals:
      name: museum_name_equals
      in: query
      description: Exact museum name.
      schema: { type: string }
    MuseumNameStartsWith:
      name: museum_name_startsWith
      in: query
      description: Museum name starts with this text.
      schema: { type: string }
    MuseumNameEndsWith:
      name: museum_name_endsWith
      in: query
      description: Museum name ends with this text.
      schema: { type: string }
    City:
      name: city
      in: query
      description: City contains this text.
      schema: { type: string }
    CityEquals:
      name: city_equals
      in: query
      description: Exact city name.
      schema: { type: string }
    CityStartsWith:
      name: city_startsWith
      in: query
      description: City starts with this text.
      schema: { type: string }
    CityEndsWith:
      name: city_endsWith
      in: query
      description: City ends with this text.
      schema: { type: string }
    MuseumType:
      name: museum_type
      in: query
      description: Museum type contains this text.
      schema: { type: string }
    MuseumTypeEquals:
      name: museum_type_equals
      in: query
      description: Exact museum type.
      schema: { type: string }
    MuseumTypeStartsWith:
      name: museum_type_startsWith
      in: query
      description: Museum type starts with this text.
      schema: { type: string }
    MuseumTypeEndsWith:
      name: museum_type_endsWith
      in: query
      description: Museum type ends with this text.
      schema: { type: string }
    ArtifactId:
      name: artifactId
      in: path
      required: true
      description: Positive integer artifact identifier.
      schema: { type: integer, minimum: 1 }
      example: 1
    PageParam:
      name: current_page
      in: query
      description: Page number for pagination (starts from 1)
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    PageSizeParam:
      name: page_size
      in: query
      description: The number of items generated for each page
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 10
      example: 2

    SiteNameParam:
      name: site_name
      in: query
      description: Case-insensitive "contains" match on the site name.
      required: false
      schema:
        type: string
      example: pompeii

    SiteTypeParam:
      name: site_type
      in: query
      description: Case-insensitive "contains" match on the site type.
      required: false
      schema:
        type: string
      example: basilica

    DiscoveryDateParam:
      name: discovery_date
      in: query
      required: false
      description: |
        Two comma-separated dates (start,end). Each date is `YYYY-MM-DD` or
        `YYYY-MM`. Dates cannot be in the future and start must not be after end.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}(-\d{2})?,\d{4}-\d{2}(-\d{2})?$'
      example: 2006-01-22,2026-09-13

    MinAgeParam:
      name: age_min
      in: query
      description: Minimum estimated age in years. Cannot be negative.
      required: false
      schema:
        type: number
        minimum: 0
        maximum: 600000000
      example: 4000

    MaxAgeParam:
      name: age_max
      in: query
      description: Maximum estimated age in years. Cannot be negative.
      required: false
      schema:
        type: number
        minimum: 0
        maximum: 600000000
      example: 10000

    CountryParam:
      name: country
      in: query
      description: Case-insensitive "contains" match on the country.
      required: false
      schema:
        type: string
      example: italy

    RegionParam:
      name: region
      in: query
      description: Case-insensitive "contains" match on the region.
      required: false
      schema:
        type: string
      example: sicily

    ProtectedParam:
      name: is_protected
      in: query
      description: Filter on protected status. Accepts `true`, `false`, `1` or `0`.
      required: false
      schema:
        type: string
        enum: ["true", "false", "1", "0"]
      example: "true"

    CultureIdParam:
      name: culture_id
      in: query
      description: Only sites belonging to this culture. Must be a positive integer.
      required: false
      schema:
        type: integer
        minimum: 1
      example: 4

    PeriodIdParam:
      name: period_id
      in: query
      description: Only sites belonging to this historical period. Must be a positive integer.
      required: false
      schema:
        type: integer
        minimum: 1
      example: 8

    SiteSortParam:
      name: sort
      in: query
      required: false
      description: |
        Field to sort by. Ascending by default; prefix with `-` for descending
        (e.g. `-discovery_date`).
        Sortable fields: site_name, site_type, discovery_date, estimated_age,
        country, region, latitude, longitude, culture_id, period_id.
      schema:
        type: string
        pattern: "^-?(site_name|site_type|discovery_date|estimated_age|country|region|latitude|longitude|culture_id|period_id)$"
      example: -estimated_age

    SiteId:
      name: siteId
      in: path
      required: true
      description: Positive integer site identifier.
      schema: { type: integer, minimum: 1 }
      example: 5
  schemas:
    Museum:
      type: object
      description: Museum Object
      properties:
        museum_id: { type: integer }
        museum_name: { type: string }
        city: { type: string, nullable: true }
        foundation_date: { type: string, format: date, nullable: true }
        website: { type: string, nullable: true }
        museum_type: { type: string, nullable: true }
    Scientist:
      type: object
      description: Scientist object
      properties:
        scientist_id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        degree: { type: string, enum: [BA, BSc, MA, MSc, PhD], nullable: true }
        specialization: { type: string, nullable: true }
        museum_id: { type: integer, nullable: true }
        years_of_experience: { type: integer, nullable: true }
        is_active: { type: boolean }
        biography: { type: string, nullable: true }
    Artifact:
      type: object
      description: Artifact object
      properties:
        artifact_id: { type: integer }
        artifact_name: { type: string }
        estimated_value: { type: number, format: float, nullable: true }
        artifact_type: { type: string }
        museum_id: { type: integer }
        condition: { type: string }
        material: { type: string, nullable: true }
        weight_in_g: { type: number, nullable: true }
        height_in_cm: { type: number, nullable: true }
    Site:
      type: object
      description: Archeological site object
      properties:
        site_id: { type: integer }
        site_name: { type: string }
        site_type: { type: string }
        discovery_date: { type: string, format: date, nullable: true }
        estimated_age: { type: number, nullable: true }
        country: { type: string }
        region: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        is_protected: { type: boolean }
        culture_id: { type: integer, nullable: true }
        period_id: { type: integer, nullable: true }
      required: [site_id, site_name, site_type, country]
    PaginationMeta:
      type: object
      additionalProperties: true
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1 }
        total_records: { type: integer, minimum: 0 }
    MuseumCollection:
      type: object
      properties:
        meta: { $ref: "#/components/schemas/PaginationMeta" }
        data:
          type: array
          items: { $ref: "#/components/schemas/Museum" }
      required: [meta, data]
    ScientistCollection:
      type: object
      properties:
        meta: { $ref: "#/components/schemas/PaginationMeta" }
        data:
          type: array
          items: { $ref: "#/components/schemas/Scientist" }
      required: [meta, data]
    ArtifactCollection:
      type: object
      properties:
        meta: { $ref: "#/components/schemas/PaginationMeta" }
        data:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
      required: [meta, data]
    SiteCollection:
      type: object
      properties:
        meta: { $ref: "#/components/schemas/PaginationMeta" }
        data:
          type: array
          items: { $ref: "#/components/schemas/Site" }
      required: [meta, data]
    Error:
      type: object
      description: Provisional JSON error structure; match the team's actual HttpErrorHandler.
      properties:
        code: { type: integer }
        status: { type: string }
        message: { type: string }
      required: [code, message]

  responses:
    BadRequest:
      description: Invalid query parameter or malformed resource ID.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: 400, status: Error, message: Malformed resource ID. }
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: 404, status: Error, message: Resource not found. }

    NotAcceptable:
      description: The requested response media type is not supported.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            {
              code: 406,
              status: Error,
              message: Only application/json is supported.,
            }

    UnprocessableEntity:
      description: The server understands the request syntax and format, but cannot process the contained instructions due to semantic or data validation errors.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            {
              code: 422,
              status: Error,
              message: The server was unable to process the contained instructions,
            }

    ServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: 500, status: Error, message: Internal server error. }
